<!doctype html>
<html lang="pt-BR">
<!-- 1. HTML: descreve a estrutura da página. O head configura idioma de caracteres, tamanho da tela e título; o body contém o conteúdo visível. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarkov – Itens, Hideout, Trocas e Missões</title>
<!-- 2. CSS: define a aparência. Os estilos ficam neste arquivo para permitir abrir o aplicativo diretamente no navegador. -->
<style>
/* Tema: variáveis CSS iniciadas por -- guardam as cores. var(--gold), por exemplo, reutiliza a cor de destaque em vários componentes. */
:root{--bg:#14151a;--panel:#1d1f26;--panel2:#262932;--line:#343845;--txt:#e6e3d8;--mut:#8d909c;--gold:#e8c14d;--grn:#6fcf7f;--red:#e0675f;--acc:#c9a227}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
/* Flexbox organiza controles lado a lado e permite quebra de linha. sticky mantém o cabeçalho no topo durante a rolagem. */
header{position:sticky;top:0;z-index:10;background:#101116;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;color:var(--gold);letter-spacing:.5px}
.sp{flex:1}
select,input,button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--gold)}
#status{color:var(--mut);font-size:12px}
#storage-status{font-size:12px}
nav{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{border-radius:6px 6px 0 0;border-bottom:none;background:transparent;padding:8px 16px}
nav button.on{background:var(--panel);color:var(--gold);border-color:var(--line)}
.badge{background:var(--gold);color:#111;border-radius:10px;padding:0 7px;font-size:12px;margin-left:6px;font-weight:700}
main{padding:14px 16px;max-width:1200px;margin:0 auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar input[type=search]{flex:1;min-width:200px}
.category-panel{margin-bottom:14px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.category-heading{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.category-filters{display:flex;gap:7px;flex-wrap:wrap}
.category-filter{border-radius:20px;padding:6px 12px;display:inline-flex;align-items:center;gap:7px}
.category-filter[aria-pressed=true]{background:#3b3218;color:var(--gold);border-color:var(--gold)}
.category-filter:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.category-count{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.category-filter[aria-pressed=true] .category-count{color:var(--gold)}
label.ck{display:flex;gap:6px;align-items:center;color:var(--mut)}
/* CSS Grid divide cada linha em colunas: estrela, imagem, nome e preços. 1fr usa o espaço que sobrar; px define uma largura fixa. */
.row{display:grid;grid-template-columns:34px 48px 1fr 170px 130px 90px;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:6px}
.row.hd{background:transparent;border:none;color:var(--mut);font-size:12px;padding-top:0}
/* Classes representam estados visuais: hl destaca uma marcação; on identifica um botão ativo; complete indica quantidade suficiente. */
.row.hl,.chip.hl,.card.hl{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:#2a2615}
.row img{width:48px;height:48px;object-fit:contain;background:#0d0e12;border-radius:4px}
.name small{color:var(--mut);margin-left:6px}
.p small{display:block;color:var(--mut)}
/* Mantém nvl e número juntos ao lado do preço. */
.level-tag{white-space:nowrap;color:var(--mut);font-size:12px}
.price-change{display:inline-block;white-space:nowrap;font-size:12px;font-weight:600;margin-left:5px}
.star{font-size:20px;line-height:1;background:transparent;border:none;color:var(--mut);padding:2px}
.star.on{color:var(--gold)}
.mut{color:var(--mut)}.pos{color:var(--grn)}.neg{color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:flex;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px 3px 4px;cursor:pointer}
.chip img{width:32px;height:32px;object-fit:contain;background:#0d0e12;border-radius:4px}
.chip small{color:var(--mut);display:block;font-size:11px}
.arrow{align-self:center;color:var(--mut);font-size:18px;padding:0 6px}
.brt{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:6px 12px}
summary{cursor:pointer;font-weight:600;padding:6px 0}
.lvl{border-top:1px solid var(--line);padding:8px 0}
.lvl.done{opacity:.5}
.lvh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tot{background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;gap:20px;flex-wrap:wrap}
.tot b{color:var(--gold)}
.empty{color:var(--mut);padding:30px;text-align:center}
input.q{width:70px}
.marked-quantity{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.marked-quantity label{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row.marked-row,.row.marked-head{grid-template-columns:34px 48px minmax(0,1fr) 135px 210px 135px}
.marked-row.complete{opacity:.65}
.marked-remaining{margin-top:4px;font-weight:600}
.owned-controls{display:flex;align-items:center;gap:10px}
/* Botão azul com brilho e relevo inspirado na referência; tamanho reduzido para 30 px. */
.collect-button{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;min-width:30px;padding:0;border:2px solid #06428e;border-radius:50%;background:radial-gradient(circle at 76% 22%,#58bdff 0%,#1788fa 30%,#0960d7 66%,#003b97 100%);box-shadow:inset 1px 1px 2px #92d7ff,inset -2px -2px 3px #002e75,0 1px 2px #0008;color:#fff;font-size:20px;font-weight:700;line-height:1;text-shadow:0 1px 1px #003877}
.collect-button:hover{filter:brightness(1.15);border-color:#1763b6}
.collect-button:active{filter:brightness(.95);box-shadow:inset 1px 2px 4px #002e75,0 0 1px #0008}
.collect-button:focus-visible{outline:2px solid var(--txt);outline-offset:3px}
/* Missões: seleção por foto do trader, progresso e grupos por nível do jogador. */
.quest-traders{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:12px 0 18px}
.quest-trader{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;background:var(--panel);min-width:0}
.quest-trader img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#101116;border:2px solid var(--line)}
.quest-trader[aria-pressed=true]{border-color:var(--gold);background:#2a2615;color:var(--gold)}
.quest-trader[aria-pressed=true] img{border-color:var(--gold)}
.quest-trader small{color:var(--mut);font-size:11px}
.quest-profile{display:flex;gap:14px;align-items:center;margin-bottom:16px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.quest-profile img{width:80px;height:80px;border-radius:8px;object-fit:cover;background:#101116}
.quest-profile h2{margin:0 0 4px;font-size:20px;color:var(--gold)}
.quest-profile progress{display:block;width:min(360px,100%);height:9px;margin-top:8px;accent-color:var(--grn)}
.quest-profile>div{flex:1;min-width:0}
.quest-level>summary{display:flex;gap:12px;align-items:center;justify-content:space-between}
.quest-level>summary small{font-weight:400;color:var(--mut)}
.quest-card{border-top:1px solid var(--line);padding:12px 0}
.quest-card-head{display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.quest-actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.quest-raid-check input{accent-color:var(--gold)}
.quest-card h3{font-size:15px;margin:0}
.quest-card.complete h3{color:var(--grn)}
.quest-card.complete .quest-description{opacity:.7}
.quest-check{display:inline-flex;gap:7px;align-items:center;white-space:nowrap;color:var(--mut)}
.quest-check input{accent-color:var(--grn);width:17px;height:17px;cursor:pointer}
.quest-short{margin:8px 0;color:var(--txt);white-space:pre-line}
.quest-description{margin:8px 0 0;border-color:var(--line);background:var(--panel2);font-size:13px}
.quest-description summary{color:var(--gold);font-weight:500}
.quest-description ul{padding-left:20px;margin:8px 0}
.quest-description li{margin:7px 0;white-space:pre-line}
.quest-note{font-size:12px;color:var(--mut)}
.quest-name-en{display:block;margin-top:3px;font-size:12px;color:var(--mut);font-weight:400}
.quest-guide-media{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin:12px 0}
.quest-scene{margin:0;max-width:340px}
.quest-scene img{display:block;max-width:100%;max-height:210px;border-radius:6px;object-fit:contain;background:#101116}
.quest-scene figcaption,.quest-item-photo figcaption{font-size:11px;color:var(--mut);margin-top:5px}
.quest-guide-links{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.quest-guide-links a{color:var(--gold);border:1px solid var(--line);border-radius:6px;padding:5px 9px;text-decoration:none}
.quest-guide-links a:hover{border-color:var(--gold)}
.quest-steps{margin:12px 0;padding-left:24px}
.quest-steps>li{padding:8px 0 12px;border-bottom:1px solid var(--line)}
.quest-steps h4{font-size:13px;margin:0 0 6px}
.quest-steps p{margin:5px 0}
.quest-related-items{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.quest-item-photo{margin:0;width:95px;text-align:center}
.quest-item-photo img{width:80px;height:70px;object-fit:contain;background:#101116;border-radius:5px}
.quest-conditions{font-size:12px;color:var(--mut)}
.quest-guide-intro{font-size:12px;color:var(--mut);line-height:1.5}
.quest-level-label{color:var(--gold);font-size:12px;margin-left:7px;font-weight:400}
/* Raid: os itens ocupam células conforme largura/altura, como em um stash. */
.raid-heading{margin:18px 0 10px;font-size:17px;color:var(--gold)}
.raid-quest>summary{display:flex;align-items:center;gap:10px}
.raid-quest>summary img{width:42px;height:42px;border-radius:6px;object-fit:cover}
.raid-quest-name{flex:1;min-width:0}
.raid-quest-info{display:block;color:var(--mut);font-size:12px;font-weight:400;margin-top:3px}
.raid-quest-body{border-top:1px solid var(--line);padding:12px 0 4px}
.raid-quest-controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.raid-stash-panel{background:#101116;border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
/* Quatro itens por linha: minmax(0,1fr) permite encolher sem criar rolagem horizontal. */
.raid-stash{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%;min-width:0}
.raid-item{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:0;width:100%;aspect-ratio:4/3;max-height:140px;padding:6px;border:2px solid #454b53;border-radius:2px;background:radial-gradient(ellipse at center,#30363d,#191d22);color:var(--txt);cursor:pointer}
.raid-item img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 2px #0009);pointer-events:none}
.raid-item.partial{border-color:var(--gold);box-shadow:inset 0 0 0 1px #e8c14d66;background:radial-gradient(ellipse at center,#403a20,#211f16)}
.raid-item.collected{border-color:var(--grn);box-shadow:inset 0 0 0 1px #6fcf7f99;background:radial-gradient(ellipse at center,#28452f,#15241a)}
.raid-item:hover{filter:brightness(1.12)}
.raid-item:focus-visible{outline:2px solid var(--txt);outline-offset:1px;z-index:2}
.raid-item-name{position:absolute;top:2px;left:3px;right:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left;font-size:10px;text-shadow:0 1px 3px #000,0 0 3px #000;pointer-events:none}
.raid-item-count{position:absolute;bottom:2px;right:3px;background:#080b0edd;padding:0 3px;border-radius:2px;font-size:11px;font-weight:700;pointer-events:none}
.raid-item-check{position:absolute;bottom:2px;left:3px;color:var(--grn);font-size:15px;font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none}
.raid-legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin:8px 0}
.raid-legend b{font-weight:600}
@media(max-width:500px){.raid-quest>summary{align-items:flex-start}}
@media(max-width:550px){.quest-traders{grid-template-columns:repeat(3,minmax(0,1fr))}.quest-trader img{width:54px;height:54px}.quest-profile img{width:64px;height:64px}.quest-card-head{gap:8px}.quest-level>summary{align-items:baseline;flex-wrap:wrap;gap:3px}}
/* Responsividade: estas regras entram em ação em telas de até 800 px. A segunda regra mantém Tenho, Faltam e custo visíveis nos Marcados. */
@media(max-width:800px){.row{grid-template-columns:30px 40px 1fr 110px}.row>:nth-child(5),.row>:nth-child(6){display:none}}
@media(max-width:800px){.row.marked-row,.row.marked-head{grid-template-columns:30px 40px minmax(0,1fr) 110px}.row.marked-row>:nth-child(5){display:flex;grid-column:3 / -1;flex-direction:row;align-items:center;flex-wrap:wrap;gap:12px}.row.marked-row>:nth-child(6){display:block;grid-column:3 / -1}.marked-row .q{width:90px}}
</style>
</head>
<body>
<!-- 3. Controles fixos: os atributos id permitem que o JavaScript encontre o status, a seleção PVE/PVP e o botão de atualização. -->
<header>
  <h1>⚔ TARKOV · Itens, Hideout, Trocas &amp; Missões</h1>
  <span class="sp"></span>
  <span id="status">—</span>
  <span id="storage-status" role="status" title="Marcações e quantidades ficam no armazenamento deste navegador, neste computador."></span>
  <select id="mode" title="Modo de jogo">
    <option value="pve">PVE</option>
    <option value="regular">PVP</option>
  </select>
  <button id="refresh">↻ Atualizar preços</button>
</header>
<!-- data-tab associa cada botão ao nome de uma aba. Esses atributos personalizados são lidos no JavaScript como elemento.dataset.tab. -->
<nav id="tabs">
  <button data-tab="marked">⭐ Marcados<span class="badge" id="nmarked">0</span></button>
  <button data-tab="items">Itens</button>
  <button data-tab="hideout">Hideout</button>
  <button data-tab="barters">Trocas</button>
  <button data-tab="quests">Missões</button>
  <button data-tab="raid">Raid<span class="badge" id="nraid" title="Missões e itens selecionados para a Raid">0</span></button>
</nav>
<!-- Área dinâmica: render() coloca aqui o HTML da aba selecionada. O navegador representa os elementos da página por meio do DOM. -->
<main id="view"></main>

<!-- 4. JavaScript: carrega dados, faz cálculos, responde às ações e salva o progresso. Usa recursos nativos do navegador, sem bibliotecas externas. Consulte GUIA-DO-CODIGO.md. -->
<script>
// CONFIGURAÇÃO E FUNÇÕES AUXILIARES
// API é o endereço público dos dados. REFRESH_MS representa cinco minutos em milissegundos; será usado pelo temporizador no fim do arquivo.
const API = 'https://json.tarkov.dev';
const REFRESH_MS = 5 * 60 * 1000;
// $ é um atalho criado neste projeto para document.querySelector; não é jQuery.
// Um seletor como $('#status') encontra o elemento que possui id="status".
const $ = s => document.querySelector(s);
// esc transforma caracteres especiais em entidades HTML antes de inserir textos nos templates.
// Isso ajuda a impedir que nomes vindos da API sejam interpretados como tags ou atributos.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// fmt prepara valores para exibição: arredonda, usa separadores pt-BR e acrescenta ₽.
// null significa preço desconhecido e aparece como um traço; não é tratado como preço zero.
const fmt = n => (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString('pt-BR') + ' ₽';
// Exibe o percentual pronto da API, sem recalcular pela média de 24 horas.
// Para acompanhar vendas: alta em verde, queda em vermelho e estabilidade neutra.
function fleaChange(item) {
  const value = item.changeLast48hPercent;
  if (!Number.isFinite(value)) return '';
  const arrow = value > 0 ? '↑' : value < 0 ? '↓' : '→';
  const color = value > 0 ? 'pos' : value < 0 ? 'neg' : 'mut';
  const percent = Math.abs(value).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  const direction = value > 0 ? 'Alta' : value < 0 ? 'Queda' : 'Estabilidade';
  return `<span class="price-change ${color}" title="Variação em relação a ontem, informada pelo tarkov.dev" aria-label="${direction} de ${percent}% em relação a ontem">${arrow} ${percent}%</span>`;
}

// ---------- estado persistido ----------
// ESTADO SALVO: DEF contém valores iniciais; S contém as escolhas e o progresso da pessoa.
// JSON.parse converte o texto do localStorage em objeto. Object.assign combina os valores salvos com os padrões.
// try/catch permite iniciar mesmo se o navegador bloquear a leitura ou se o texto salvo estiver inválido.
const DEF = { marked: {}, done: {}, categories: [], hideoutOpen: {}, questDone: { pve: {}, regular: {} }, questOpen: {}, questTrader: '', raidQuests: { pve: {}, regular: {} }, raidCollected: { pve: {}, regular: {} }, mode: 'pve', tab: 'items' };
let S = (() => { try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem('tkv-app') || '{}')); } catch (e) { return { ...DEF }; } })();
if (!['regular', 'pve'].includes(S.mode)) S.mode = 'pve';
if (!['items', 'marked', 'hideout', 'barters', 'quests', 'raid'].includes(S.tab)) S.tab = 'items';
// Seleções de missão e itens já coletados na Raid persistem separadamente por modo.
for (const field of ['raidQuests', 'raidCollected']) {
  if (!S[field] || typeof S[field] !== 'object' || Array.isArray(S[field])) S[field] = {};
  for (const mode of ['pve', 'regular']) {
    if (!S[field][mode] || typeof S[field][mode] !== 'object' || Array.isArray(S[field][mode])) S[field][mode] = {};
  }
}
// Conclusões são independentes por modo. Acrescenta campos sem apagar dados antigos.
if (!S.questDone || typeof S.questDone !== 'object' || Array.isArray(S.questDone)) S.questDone = {};
for (const mode of ['pve', 'regular']) {
  if (!S.questDone[mode] || typeof S.questDone[mode] !== 'object' || Array.isArray(S.questDone[mode])) S.questDone[mode] = {};
}
if (!S.questOpen || typeof S.questOpen !== 'object' || Array.isArray(S.questOpen)) S.questOpen = {};
if (typeof S.questTrader !== 'string') S.questTrader = '';
// Limpa a preferência do ranking removido, preservando o restante do progresso.
delete S.marketMover;
if (!S.marked || typeof S.marked !== 'object') S.marked = {};
// Converte o antigo “já tenho tudo” sem perder os itens salvos.
for (const [id, mark] of Object.entries(S.marked)) {
  if (!mark || typeof mark !== 'object') { delete S.marked[id]; continue; }
  mark.qty = Math.max(1, Math.floor(Number(mark.qty) || 1));
  const owned = Number(mark.owned ?? (mark.have ? mark.qty : 0));
  mark.owned = Number.isFinite(owned) ? Math.max(0, Math.floor(owned)) : 0;
  delete mark.have;
}
if (!S.done || typeof S.done !== 'object') S.done = {};
if (!S.hideoutOpen || typeof S.hideoutOpen !== 'object' || Array.isArray(S.hideoutOpen)) S.hideoutOpen = {};
// localStorage guarda texto neste perfil do navegador e neste endereço/arquivo. JSON.stringify converte S em texto.
// A gravação é imediata quando save() é chamada; ela não envia suas marcações ao GitHub nem à API de preços.
const save = () => {
  const status = $('#storage-status');
  try {
    localStorage.setItem('tkv-app', JSON.stringify(S));
    status.textContent = '✓ Salvo neste PC';
    status.className = 'pos';
  } catch (e) {
    status.textContent = '⚠ Não foi possível salvar neste navegador';
    status.className = 'neg';
  }
};

// ---------- dados ----------
// DADOS EM MEMÓRIA: DB guarda as respostas da API apenas enquanto a página está aberta.
// DB.map é um Map: permite localizar um item pelo ID usando get(id), sem percorrer a lista inteira.
const DB = { items: [], map: new Map(), stations: [], barters: [], traders: [], tasks: [], questItems: new Map(), taskMap: new Map(), tasksState: 'idle', tasksError: '', updated: null, errors: [] };
// UI guarda controles temporários: busca, ordenação e limite de resultados. As buscas não são salvas ao fechar.
// hideoutOpen é restaurado de S; as categorias selecionadas ficam diretamente em S.categories e são salvas.
const UI = { limit: 150, q: '', sort: 'price', onlyMarked: false, bq: '', btrader: '', bsort: 'profit', bOnlyMarked: false, hq: '', tq: '', questStatus: 'all', questLevel: '', hideoutOpen: new Map(Object.entries(S.hideoutOpen)) };

// As categorias vêm da classificação dos itens na API, sem depender do nome traduzido.
const CATEGORIES = [
  { id: 'food', label: 'Alimentos', icon: '🍞', slugs: ['food'] },
  { id: 'drinks', label: 'Bebidas', icon: '🥤', slugs: ['drink'] },
  { id: 'ammo', label: 'Munições', icon: '🎯', slugs: ['ammo', 'ammo-container'] },
  { id: 'medical', label: 'Médicos', icon: '🩹', slugs: ['meds', 'medical-supplies'] },
  { id: 'stimulants', label: 'Estimulantes', icon: '💉', slugs: ['stimulant'] },

// CATEGORIZAÇÃO: percorre a categoria de um item e suas categorias superiores (parent).
// Set guarda valores sem repetição; visited também evita um ciclo se a classificação vier com referências circulares.
function itemGroups(item, taxonomy) {
  const slugs = new Set();
  for (const categoryId of (item.categories || [])) {
    let category = taxonomy[categoryId];
    const visited = new Set();
    while (category && !visited.has(category.id)) {
      visited.add(category.id); slugs.add(category.normalizedName);
      category = taxonomy[category.parent];
    }
  }
  const groups = CATEGORIES.filter(category => category.slugs.some(slug => slugs.has(slug))).map(category => category.id);
  return groups.length ? groups : ['other'];
}
function toggleCategory(id) {

  else if (CATEGORIES.some(category => category.id === id)) {

// A API JSON mantém referências por ID e traduções em arquivos separados.
// CONSULTA HTTP: fetch faz uma requisição GET, por exemplo /pve/items.
// async/await permite aguardar respostas sem bloquear a interação com a página. response.json() lê o conteúdo JSON.
// AbortController cancela a espera após 25 segundos; finally limpa o temporizador tanto no sucesso quanto no erro.
async function getJSON(mode, endpoint) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 25000);
  try {
    const response = await fetch(API + '/' + mode + '/' + endpoint, {
      signal: controller.signal, cache: 'no-cache', credentials: 'omit'
    });
    if (!response.ok) throw new Error(endpoint + ': HTTP ' + response.status);
    const payload = await response.json();
    if (!payload.data) throw new Error(endpoint + ': resposta sem dados');
    return payload.data;
  } catch (error) {
    if (error.name === 'AbortError') throw new Error(endpoint + ': tempo de conexão esgotado');
    throw new Error(endpoint + ': ' + error.message);
  } finally { clearTimeout(timeout); }
}
// TRADUÇÕES: Promise.all inicia a consulta principal e as traduções em português e inglês em paralelo.
// Se uma tradução falhar, usa um objeto vazio. translate procura português, inglês, nome alternativo e, por último, a própria chave.
async function localized(mode, endpoint) {
  const [data, pt, en] = await Promise.all([
    getJSON(mode, endpoint),
    getJSON(mode, endpoint + '_pt').catch(() => ({})),
    getJSON(mode, endpoint + '_en').catch(() => ({}))
  ]);
  return { data, translate: (key, fallback) => pt[key] || en[key] || fallback || key,
    english: (key, fallback) => en[key] || fallback || key };
}
// NORMALIZAÇÃO: adapta a estrutura recebida para o formato que a interface usa.
// map() transforma cada item em um novo objeto. Aqui também são associados categorias, comerciantes e preços válidos.
function normalizeItems(source, translate, traders, taxonomy = {}) {
  if (!source || typeof source !== 'object') throw new Error('Lista de itens inválida');
  const items = Object.values(source).map(item => ({
    id: item.id, name: translate(item.name, item.normalizedName || item.id),
    shortName: translate(item.shortName, item.normalizedName || item.id),
    iconLink: item.iconLink, width: item.width, height: item.height,
    gridImageLink: item.gridImageLink || item.iconLink,
    guideImageLink: item.image512pxLink || item.baseImageLink || item.iconLink,
    groups: itemGroups(item, taxonomy),
    updated: item.lastScan || item.updated,
    lastLowPrice: item.lastLowPrice > 0 ? item.lastLowPrice : null,
    avg24hPrice: item.avg24hPrice > 0 ? item.avg24hPrice : null,
    changeLast48hPercent: Number.isFinite(item.changeLast48hPercent) ? item.changeLast48hPercent : null,
    // Requisito informado pela API; null mantém explícita a ausência de informação.
    minLevelForFlea: item.minLevelForFlea ?? null,
    buyFromTrader: (item.buyFromTrader || []).map(offer => ({
  ...offer,
  traderName: traders.get(offer.trader)?.name || 'Comerciante'
})),
    sellFor: (item.sellToTrader || []).map(offer => ({
      priceRUB: offer.priceRUB,
      vendor: { name: traders.get(offer.trader)?.name || 'Comerciante' }
    }))
  }));
  if (!items.length) throw new Error('A API retornou uma lista vazia');
  return items;
}

function normalizeTasks(source, translate, english = translate) {

// ATUALIZAÇÃO COMPLETA: cada carregamento recebe uma versão. Se outra atualização começar antes do fim,
// a resposta antiga será ignorada para não sobrescrever a seleção atual, especialmente ao trocar PVE/PVP.
let loadVersion = 0;

  const version = ++loadVersion, mode = S.mode;

  }
  // As missões são estáveis: carrega uma vez por modo, sem baixá-las a cada atualização de preços.
  const needTasks = DB.tasksState !== 'ready';
  if (needTasks) { DB.tasksState = 'loading'; DB.tasksError = ''; }
// Promise.allSettled espera todas as consultas e informa quais deram certo e quais falharam.
// Assim, uma falha em Trocas não impede o uso dos Itens que carregaram corretamente.
  const results = await Promise.allSettled([
    localized(mode, 'items'), localized(mode, 'hideout'),
    getJSON(mode, 'barters'), localized(mode, 'traders'),

  ]);
  if (version !== loadVersion) return;

  results.forEach((result, index) => {

  const traderData = value(3);

    ...trader, name: traderData.translate(trader.name, trader.normalizedName)
  }]));
  if (traderData) DB.traders = [...traders.values()];
  if (needTasks) {

      DB.questItems = new Map(Object.values(taskData.data.questItems || {}).map(item => [item.id, {

      DB.tasksState = 'ready';
    } catch (error) {
      DB.tasksState = 'error'; DB.tasksError = error.message;

    }
  }
  const itemData = value(0);
  if (itemData) {
    try {
      DB.items = normalizeItems(itemData.data.items, itemData.translate, traders, itemData.data.itemCategories || {});
      DB.map = new Map(DB.items.map(item => [item.id, item]));

    } catch (error) { DB.errors.push('Itens: ' + error.message); }
  }
// A API devolve referências de itens por ID. Esta função troca o ID pelo objeto completo de DB.map
// para que os requisitos do Hideout e das trocas possam mostrar nome, imagem e preço.
  const ref = requirement => ({ ...requirement, item: DB.map.get(requirement.item) || {
    id: requirement.item, name: 'Item ' + requirement.item, shortName: '', iconLink: ''
  }});
  const hideout = value(1);

// ---------- helpers de preço ----------
// REGRA DE ESTIMATIVA: tenta última oferta do flea, média de 24h, menor compra no comerciante e melhor venda.
// É uma referência de valor, não uma garantia de compra: ofertas de comerciantes podem exigir nível ou desbloqueio.
// A moeda rublo vale 1 nesta conta; preços ausentes retornam null.
const price = it => {
  if (!it) return null;
  if (it.id === '5449016a4bdc2d6f028b456f') return 1;
  if (it.lastLowPrice > 0) return it.lastLowPrice;
  if (it.avg24hPrice > 0) return it.avg24hPrice;
  const offers = (it.buyFromTrader || []).map(o => o.priceRUB).filter(p => p > 0);
  return offers.length ? Math.min(...offers) : (traderSell(it).best || null);
};
const multiplyPrice = (value, count) => value == null ? null : value * count;
// reduce() soma valores. Se algum preço estiver desconhecido, o total também fica desconhecido
// para evitar apresentar uma estimativa incompleta como se fosse o custo total.
const sumPrices = values => values.some(value => value == null) ? null : values.reduce((sum, value) => sum + value, 0);
const costOf = refs => sumPrices(refs.map(r => multiplyPrice(priceById(r.item.id), r.count)));
const priceById = id => price(DB.map.get(id));
function traderSell(it) {
  let best = 0, who = '';
  for (const s of (it.sellFor || [])) {
    if (s.vendor && s.vendor.name === 'Flea Market') continue;
    if (s.priceRUB > best) { best = s.priceRUB; who = s.vendor?.name || 'Comerciante'; }
  }
  return { best, who };
}
// MARCAÇÕES INDEPENDENTES: o ID de um item sozinho identifica a marcação geral.
// No Hideout, a chave combina estação + nível + item: hideout:estacao:nivel:item.
// Por isso o mesmo item pode existir em duas construções com quantidades e estoques separados.
const markKey = (id, source) => source ? 'hideout:' + source.stationId + ':' + source.level + ':' + id : id;
const isMarked = (id, source) => !!S.marked[markKey(id, source)];
const hasMarkedItem = id => Object.entries(S.marked).some(([key, mark]) => (mark.itemId || key) === id);
const hideoutSource = (station, level) => ({ stationId: station.id, stationName: station.name, level });
// toggleMark alterna uma marcação: remove se existir; cria se não existir.
// qty é a necessidade da origem; owned começa em zero. source identifica a construção quando houver.
function toggleMark(id, qty, source) {
  const key = markKey(id, source);
  if (S.marked[key]) delete S.marked[key];
  else {
    clearRaidCollected(id);
    S.marked[key] = { itemId: id, qty: qty || 1, owned: 0, ...(source ? { source } : {}) };
  }
  save();
}
// O botão de marcar um nível usa addMark: garante a marcação sem desmarcar o que já existe.
// Math.max evita somar novamente ao clicar duas vezes; o valor owned já informado é preservado.
function addMark(id, qty, source) {
  const key = markKey(id, source), m = S.marked[key];
  if (!m || (qty || 1) > m.qty) clearRaidCollected(id);
  if (m) m.qty = Math.max(m.qty, qty || 1); else S.marked[key] = { itemId: id, qty: qty || 1, owned: 0, ...(source ? { source } : {}) };
  save();
}

// QUANTIDADES: faltam = máximo entre zero e (necessidade - quantidade que tenho).
// Exemplo: qty 10 e owned 4 resultam em 6. A necessidade vem da marcação e não é editável em Marcados.
const remaining = mark => Math.max(0, mark.qty - mark.owned);
// Agrupa as marcações por produto apenas para a lista de compras.
// As chaves de estação e nível continuam separadas em S.marked, preservando o Hideout.
function markedRows() {
  const groups = new Map();
  for (const [key, mark] of Object.entries(S.marked)) {
    const id = mark.itemId || key;
    if (!groups.has(id)) groups.set(id, { id, keys: [], sources: [], m: { qty: 0, owned: 0 } });
    const group = groups.get(id);
    group.keys.push(key);
    group.sources.push(mark.source || null);
    group.m.qty += mark.qty;
    group.m.owned += mark.owned;
  }
  return [...groups.values()].map(group => {
    const it = DB.map.get(group.id), p = price(it), missing = remaining(group.m);
    return { ...group, it, p, missing, sub: missing === 0 ? 0 : multiplyPrice(p, missing), full: multiplyPrice(p, group.m.qty) };
  }).sort((a, b) => ((a.missing === 0) - (b.missing === 0)) || ((a.it?.name || '').localeCompare(b.it?.name || '', 'pt-BR')));
}
// Desmarcar uma linha agrupada retira todas as suas origens, sem afetar outros produtos.
function unmarkItem(id) {
  for (const [key, mark] of Object.entries(S.marked)) {
    if ((mark.itemId || key) === id) delete S.marked[key];
  }
}
// Cada clique registra uma unidade no estoque total do produto agrupado.
// Quando a última unidade necessária é registrada, remove todas as suas marcações.
function collectOne(id, origin = 'marked') {
  const group = markedRows().find(row => row.id === id);
  if (!group) return;
  if (group.missing <= 1) {
    if (origin === 'raid') {
      const item = group.it;
      S.raidCollected[S.mode][id] = {
        id, name: item?.name || id, shortName: item?.shortName || '',
        imageLink: item?.gridImageLink || item?.guideImageLink || item?.iconLink || '',
        width: item?.width || 1, height: item?.height || 1,
        qty: group.m.qty, owned: group.m.qty, state: 'complete'
      };
    }
    unmarkItem(id);
  } else {
    // Distribui o estoque entre as origens sem duplicar unidades.
    let available = group.m.owned + 1;
    group.keys.forEach(key => {
      const mark = S.marked[key];
      mark.owned = Math.min(mark.qty, available);
      available -= mark.owned;
    });
  }
  save();
  render();
}
// ABA MARCADOS: cada produto ocupa uma linha com as necessidades de todas as origens somadas.

    <span class="sp"></span><button data-act="clearHave">Remover itens completos</button> <button data-act="clearAll">Limpar tudo</button></div>
  <p class="mut">Clique no + azul para adicionar uma unidade. Ao completar a quantidade, o item é desmarcado em todas as origens.</p>
  <div class="row hd marked-head"><span></span><span></span><span>Item</span><span>Preço un. estimado</span><span>Tenho / Faltam</span><span>Custo restante</span></div>
  ${rows.map(({ id, it, m, sources, p, missing, sub }) => `<div class="row hl marked-row ${missing === 0 ? 'complete' : ''}" data-marked-row="${esc(id)}">
    <button class="star on" data-act="unmarkItem" data-id="${esc(id)}" title="Desmarcar este item em todas as origens">★</button>
    ${it ? `<img loading="lazy" src="${esc(it.iconLink)}" alt="">` : '<span></span>'}
    <div class="name">${esc(it ? it.name : id)}<small>${esc(it ? it.shortName : '')}</small><div class="mut">${sources.map(source => source ? 'Hideout · ' + esc(DB.stations.find(station => station.id === source.stationId)?.name || source.stationName || source.stationId) + ' · Nível ' + esc(source.level) : 'Marcação geral').join(' / ')}</div><div class="mut">Total necessário: ${esc(m.qty)}</div></div>
    <div class="p">${fmt(p)}</div>

// ABA HIDEOUT: organiza estações e níveis. O elemento HTML details cria a seção expansível; summary é seu título.
// A origem passada a chip inclui a estação e o nível. Os estados open são restaurados para a construção continuar aberta.
function viewHideout() {
  const q = UI.hq.trim().toLowerCase();
  let out = `<div class="bar"><input type="search" id="hq" placeholder="Buscar estação ou item de requisito…" value="${esc(UI.hq)}">
    <span class="mut">Clique em um item para marcá-lo · marque o nível como concluído para esmaecer</span></div>`;
  const stations = DB.stations.filter(s => !q || s.name.toLowerCase().includes(q) ||
    s.levels.some(l => l.itemRequirements.some(r => (r.item.name + r.item.shortName).toLowerCase().includes(q))));
  if (!stations.length) return out + '<div class="empty">Nada para mostrar.</div>';
  out += stations.map(s => {
    const levels = s.levels.filter(l => l.itemRequirements.length || !q);
    const pend = s.levels.filter(l => !S.done[s.id + ':' + l.level]).length;
    const open = UI.hideoutOpen.has(s.id) ? UI.hideoutOpen.get(s.id) : !!q;
    return `<details data-station="${esc(s.id)}" ${open ? 'open' : ''}><summary>${esc(s.name)} <span class="mut">· ${pend} nível(is) pendente(s)</span></summary>
    ${levels.map(l => {
      const done = !!S.done[s.id + ':' + l.level];
      const cost = costOf(l.itemRequirements);
      const mins = Math.round((l.constructionTime || 0) / 60);
      return `<div class="lvl ${done ? 'done' : ''}"><div class="lvh">
        <b>Nível ${l.level}</b>
        <label class="ck"><input type="checkbox" data-act="done" data-key="${esc(s.id + ':' + l.level)}" ${done ? 'checked' : ''}> concluído</label>
        <span class="mut">construção: ${mins >= 60 ? Math.round(mins / 6) / 10 + ' h' : mins + ' min'}</span>
        <span class="mut">custo dos itens: ${fmt(cost)}</span>
        <button data-act="markLevel" data-key="${esc(s.id + ':' + l.level)}">★ marcar itens do nível</button></div>
        <div class="chips">${l.itemRequirements.map(r => chip(r, r.count, hideoutSource(s, l.level))).join('') || '<span class="mut">sem itens necessários</span>'}</div></div>`;
    }).join('')}</details>`;
  }).join('');
  return out;
}

// ABA TROCAS: estima custo dos itens entregues e valor dos recebidos. A diferença é uma comparação de valores,
// não lucro garantido: esta conta não desconta taxas nem confirma disponibilidade ou desbloqueios.
function viewBarters() {
  const q = UI.bq.trim().toLowerCase();
  const traders = [...new Set(DB.barters.map(b => b.trader.name))].sort();
  let list = DB.barters.map(b => {
    const cost = costOf(b.requiredItems);
    const gain = costOf(b.rewardItems);
    const hit = [...b.requiredItems, ...b.rewardItems].some(r => isMarked(r.item.id));
    return { b, cost, gain, profit: gain == null || cost == null ? null : gain - cost, hit };
  }).filter(x => (!UI.btrader || x.b.trader.name === UI.btrader) &&
    (!UI.bOnlyMarked || x.hit) &&
    (!q || [...x.b.requiredItems, ...x.b.rewardItems].some(r => (r.item.name + r.item.shortName).toLowerCase().includes(q))));
  const sorters = { profit: (a, b) => b.profit - a.profit, trader: (a, b) => a.b.trader.name.localeCompare(b.b.trader.name) || a.b.level - b.b.level, cost: (a, b) => a.cost - b.cost };
  list.sort(sorters[UI.bsort]);
  const total = list.length; list = list.slice(0, 120);
  return `<div class="bar">
    <input type="search" id="bq" placeholder="Buscar item em trocas…" value="${esc(UI.bq)}">
    <select id="btrader"><option value="">Todos os traders</option>${traders.map(t => `<option ${UI.btrader === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
    <select id="bsort">
      <option value="profit" ${UI.bsort === 'profit' ? 'selected' : ''}>Maior lucro estimado</option>
      <option value="trader" ${UI.bsort === 'trader' ? 'selected' : ''}>Trader / nível</option>
      <option value="cost" ${UI.bsort === 'cost' ? 'selected' : ''}>Menor custo</option>
    </select>
    <label class="ck"><input type="checkbox" id="bOnlyMarked" ${UI.bOnlyMarked ? 'checked' : ''}> só com itens marcados</label>
    <span class="mut">${total} troca(s)${total > 120 ? ' · mostrando 120' : ''}</span></div>
  ${list.map(({ b, cost, gain, profit, hit }) => `<div class="card ${hit ? 'hl' : ''}">
    <h3>${esc(b.trader.name)} <span class="mut">· nível ${b.level}</span></h3>
    <div class="brt"><div class="chips">${b.requiredItems.map(r => chip(r, r.count)).join('')}</div><span class="arrow">➜</span>
    <div class="chips">${b.rewardItems.map(r => chip(r, r.count)).join('')}</div></div>
    <div class="mut">Custo estimado: ${fmt(cost)} · Valor recebido: ${fmt(gain)} · Lucro estimado: <b class="${profit >= 0 ? 'pos' : 'neg'}">${fmt(profit)}</b></div></div>`).join('')
    || '<div class="empty">Nenhuma troca encontrada.</div>'}`;
}

// URLs visuais e de guias vêm da fonte; aceita somente os provedores usados pelo projeto.
function questGuideURL(value, kind = 'image') {
  try {
    const url = new URL(value);
    const allowed = kind === 'image' ? ['assets.tarkov.dev'] : ['escapefromtarkov.fandom.com', 'escapefromtarkov.wiki', 'tarkov.dev'];
    return url.protocol === 'https:' && allowed.includes(url.hostname) ? url.href : '';
  } catch (_) { return ''; }
}

function questObjectiveConditions(objective) {
  const conditions = [];
  if (objective.count > 0) conditions.push('Quantidade: ' + objective.count);
  if (objective.optional) conditions.push('Objetivo opcional');
  if (objective.foundInRaid) conditions.push('Exige a condição encontrado em raid; confira a marca do item antes da entrega.');
  if (objective.distance?.value > 0) conditions.push('Distância: ' + (objective.distance.compareMethod || '') + ' ' + objective.distance.value + ' m');
  if (Number.isFinite(objective.timeFromHour) && Number.isFinite(objective.timeUntilHour) && objective.timeFromHour !== objective.timeUntilHour) conditions.push('Horário: ' + objective.timeFromHour + 'h até ' + objective.timeUntilHour + 'h');
  if (objective.bodyParts?.length) conditions.push('Parte do corpo: ' + objective.bodyParts.join(', '));
  if (objective.level > 0) conditions.push('Nível exigido neste objetivo: ' + objective.level);
  const attributes = { accuracy: 'Precisão', durability: 'Durabilidade', effectiveDistance: 'Alcance efetivo', ergonomics: 'Ergonomia', height: 'Altura', magazineCapacity: 'Capacidade do carregador', muzzleVelocity: 'Velocidade do projétil', recoil: 'Recuo', weight: 'Peso', width: 'Largura' };
  Object.entries(objective.buildAttributes || {}).forEach(([name, rule]) => {
    if (Number.isFinite(rule?.value) && rule.value > 0) conditions.push((attributes[name] || name) + ': ' + (rule.compareMethod || '') + ' ' + rule.value);
  });
  return conditions;
}

      <progress value="${completed}" max="${allTraderTasks.length}" aria-label="Progresso das missões de ${esc(selected.name)}"></progress></div></section>
    <div class="bar"><input type="search" id="tq" placeholder="Buscar missão ou descrição dos objetivos…" value="${esc(UI.tq)}" aria-label="Buscar missão ou objetivo">
      <select id="questStatus" aria-label="Filtrar por conclusão"><option value="all" ${UI.questStatus === 'all' ? 'selected' : ''}>Todas as missões</option><option value="pending" ${UI.questStatus === 'pending' ? 'selected' : ''}>Pendentes</option><option value="done" ${UI.questStatus === 'done' ? 'selected' : ''}>Concluídas</option></select>
      <select id="questLevel" aria-label="Filtrar por nível mínimo do jogador"><option value="">Todos os níveis</option>${levels.map(level => `<option value="${level ?? 'unknown'}" ${UI.questLevel === String(level ?? 'unknown') ? 'selected' : ''}>${levelLabel(level)}</option>`).join('')}</select>
      <span class="mut">${tasks.length} missão(ões)</span></div>
    <p class="quest-note">Nomes em português e inglês. Abra “Como fazer e fotos” para ver instruções por objetivo e imagens relacionadas. O nível mínimo do jogador não substitui outros pré-requisitos.</p>
    ${groups.map(level => {
      const levelTasks = tasks.filter(task => task.minPlayerLevel === level).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
      const key = 'level:' + selected.id + ':' + (level ?? 'unknown');
      return `<details class="quest-level" data-quest-open="${esc(questOpenKey(key))}" ${questIsOpen(key) ? 'open' : ''}>
        <summary><span>${levelLabel(level)}</span><small>${levelTasks.filter(task => questIsDone(task.id)).length} / ${levelTasks.length} concluídas</small></summary>
        ${levelTasks.map(task => {
          const done = questIsDone(task.id), taskKey = 'task:' + task.id;
          const requirements = task.prerequisites.map(requirement => {
            const name = DB.taskMap.get(requirement.id)?.name || 'Missão não identificada';
            return esc(name) + (requirement.statuses.length ? ' (' + requirement.statuses.map(status => esc(taskStatusLabels[status] || status)).join(' / ') + ')' : '');
          });
          return `<article class="quest-card ${done ? 'complete' : ''}" data-quest-id="${esc(task.id)}">
            <div class="quest-card-head"><h3><span lang="pt-BR">${esc(task.name)}</span><span class="quest-name-en" lang="en">${esc(task.nameEN)}</span>${task.faction !== 'Any' ? `<span class="quest-level-label">${esc(task.faction)}</span>` : ''}</h3>
              <div class="quest-actions">${questRaidControl(task)}<label class="quest-check"><input type="checkbox" data-act="questDone" data-id="${esc(task.id)}" ${done ? 'checked' : ''} aria-label="Marcar ${esc(task.name)} como concluída">Concluída</label></div></div>
            <p class="quest-short">${esc(task.objectives[0]?.description || 'Descrição não disponibilizada pela fonte de dados.')}</p>
            <details class="quest-description" data-quest-open="${esc(questOpenKey(taskKey))}" ${questIsOpen(taskKey, !!query) ? 'open' : ''}>
              <summary>Como fazer e fotos · ${task.objectives.length} objetivo(s)</summary>
              ${questExecutionGuide(task)}
              ${requirements.length ? `<p class="quest-note">Pré-requisitos informados: ${requirements.join('; ')}.</p>` : ''}
            </details></article>`;
        }).join('')}</details>`;
    }).join('') || '<div class="empty">Nenhuma missão corresponde aos filtros deste trader.</div>'}`;
}

// RAID: a lista viva usa as mesmas quantidades de Marcados.
// Quando completa pela Raid, a marcação é removida e uma ficha verde fica até duas confirmações.
function clearRaidCollected(id) {
  for (const mode of ['pve', 'regular']) delete S.raidCollected[mode][id];
}
function raidItemRows() {
  const rows = markedRows().map(group => ({
    id: group.id, name: group.it?.name || group.id, shortName: group.it?.shortName || '',
    imageLink: group.it?.gridImageLink || group.it?.guideImageLink || group.it?.iconLink || '',
    width: group.it?.width || 1, height: group.it?.height || 1,
    qty: group.m.qty, owned: group.m.owned, missing: group.missing,
    state: group.m.owned > 0 ? 'partial' : 'pending'
  }));
  const liveIds = new Set(rows.map(row => row.id));
  for (const [id, saved] of Object.entries(S.raidCollected[S.mode])) {
    if (!saved || typeof saved !== 'object' || liveIds.has(id)) continue;
    rows.push({ ...saved, id, missing: 0, state: saved.state === 'confirmed' ? 'confirmed' : 'complete' });
  }
  return rows.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR') || a.id.localeCompare(b.id));
}
function raidCollectItem(id) {
  // Um novo requisito vivo tem prioridade sobre uma ficha de coleta antiga.
  if (hasMarkedItem(id)) { collectOne(id, 'raid'); return; }
  const item = S.raidCollected[S.mode][id];
  if (!item) return;
  if (item.state === 'confirmed') delete S.raidCollected[S.mode][id];
  else item.state = 'confirmed';
  save(); render();
}
function viewRaid() {
  const items = raidItemRows();
  const taskIds = Object.keys(S.raidQuests[S.mode]).filter(id => raidQuestSelected(id));
  const missing = items.reduce((total, item) => total + item.missing, 0);
  const modeLabel = S.mode === 'pve' ? 'PVE' : 'PVP';
  const questCards = taskIds.map(id => {
    const task = DB.taskMap.get(id), saved = S.raidQuests[S.mode][id];
    if (!task) return `<article class="card"><h3>${esc(saved.name || 'Missão selecionada')}</h3><p class="mut">${DB.tasksState === 'error' ? 'Falha ao carregar o guia. Tente atualizar as missões.' : 'Aguardando os dados desta missão.'}</p><label class="quest-check"><input type="checkbox" data-act="raidQuest" data-id="${esc(id)}" checked>Na Raid</label></article>`;
    const trader = DB.traders.find(trader => trader.id === task.traderId) || { name: 'Trader', imageLink: '' };
    const done = questIsDone(task.id), key = 'raid-task:' + task.id;
    const requirements = task.prerequisites.map(requirement => esc(DB.taskMap.get(requirement.id)?.name || 'Missão não identificada'));
    return `<details class="raid-quest" data-quest-open="${esc(questOpenKey(key))}" ${questIsOpen(key, false) ? 'open' : ''}>
      <summary>${questTraderImage(trader)}<span class="raid-quest-name"><span class="${done ? 'pos' : ''}">${esc(task.name)}${done ? ' · ✓ Concluída' : ''}</span><span class="quest-name-en" lang="en">${esc(task.nameEN)}</span><span class="raid-quest-info">${esc(trader.name)} · ${task.minPlayerLevel == null ? 'Nível não informado' : 'nvl ' + esc(task.minPlayerLevel)}</span></span></summary>
      <div class="raid-quest-body"><div class="raid-quest-controls">${questRaidControl(task)}<label class="quest-check"><input type="checkbox" data-act="questDone" data-id="${esc(task.id)}" ${done ? 'checked' : ''}>Concluída</label></div>
      ${questExecutionGuide(task)}${requirements.length ? `<p class="quest-note">Missões relacionadas nos pré-requisitos: ${requirements.join('; ')}.</p>` : ''}</div></details>`;
  }).join('');
  return `<div class="tot"><span>Raid · <b>${modeLabel}</b></span><span>Missões: <b>${taskIds.length}</b></span><span>Itens diferentes: <b>${items.length}</b></span><span>Unidades que faltam: <b>${missing}</b></span></div>
    <h2 class="raid-heading">Missões da Raid</h2>
    ${DB.tasksState === 'error' && taskIds.length ? '<p><button data-act="reloadTasks">Atualizar missões</button></p>' : ''}
    ${questCards || '<div class="empty">Na aba Missões, marque “Na Raid” nas tarefas que deseja acompanhar aqui.</div>'}
    <h2 class="raid-heading">Itens da Raid · stash</h2>
    <div class="raid-legend"><span><b style="color:var(--gold)">Amarelo:</b> coleta em andamento</span><span><b class="pos">Verde:</b> quantidade completa</span></div>
    <p class="quest-note">Clique em um item para somar 1 em “Tenho”. Ao completar, ele fica verde. O próximo clique confirma e mantém o item; o seguinte o retira da Raid.</p>
    ${items.length ? `<div class="raid-stash-panel"><div class="raid-stash" role="group" aria-label="Stash com itens marcados para a Raid">${items.map(item => {
      const collected = item.state === 'complete' || item.state === 'confirmed';
      const image = questGuideURL(item.imageLink);
      const action = item.state === 'complete' ? 'Completo. Clique para confirmar e manter; no próximo clique será removido.' : item.state === 'confirmed' ? 'Confirmado. Clique para retirar da Raid.' : 'Clique para coletar mais uma unidade.';
      const description = item.name + '. Tenho ' + item.owned + ' de ' + item.qty + '. Faltam ' + item.missing + '. ' + action;
      return `<button type="button" class="raid-item ${collected ? 'collected' : item.state === 'partial' ? 'partial' : ''}" data-act="raidCollect" data-id="${esc(item.id)}" title="${esc(description)}" aria-label="${esc(description)}">
        ${image ? `<img src="${esc(image)}" alt="" loading="lazy">` : '<span aria-hidden="true">📦</span>'}<span class="raid-item-name">${esc(item.shortName || item.name)}</span><span class="raid-item-count">${esc(item.owned)}/${esc(item.qty)}</span>${collected ? '<span class="raid-item-check" aria-hidden="true">✓</span>' : ''}</button>`;
    }).join('')}</div></div>` : '<div class="empty">Marque itens em Itens, Hideout ou Trocas para levá-los à Raid.</div>'}`;
}

// ---------- render ----------
// RENDERIZAÇÃO: escolhe a função da aba atual e substitui o conteúdo de #view usando innerHTML.
// Antes da troca, registra as estações abertas; depois restaura o foco e a posição do cursor nos campos de busca.
// Como innerHTML interpreta tags, textos externos interpolados nos templates devem passar por esc().
function render() {
  // A lista é recriada ao marcar itens; conserva cada estação aberta ou fechada.
  let changed = false;
  document.querySelectorAll('#view details[data-quest-open]').forEach(details => {
    if (S.questOpen[details.dataset.questOpen] !== details.open) {
      S.questOpen[details.dataset.questOpen] = details.open;
      changed = true;
    }
  });
  document.querySelectorAll('#view details[data-station]').forEach(details => {
    UI.hideoutOpen.set(details.dataset.station, details.open);
    if (S.hideoutOpen[details.dataset.station] !== details.open) {
      S.hideoutOpen[details.dataset.station] = details.open;
      changed = true;
    }
  });
  if (changed) save();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  $('#nmarked').textContent = markedRows().length;
  $('#nraid').textContent = raidItemRows().length + Object.keys(S.raidQuests[S.mode]).filter(id => raidQuestSelected(id)).length;
  const v = { items: viewItems, marked: viewMarked, hideout: viewHideout, barters: viewBarters, quests: viewQuests, raid: viewRaid }[S.tab];
  if (!['quests', 'raid'].includes(S.tab) && !DB.items.length && !DB.stations.length && !DB.barters.length && !DB.tasks.length) {
    $('#view').innerHTML = `<div class="empty">${DB.errors.length ? 'Não foi possível carregar os dados.<br>' + esc(DB.errors.join(' | ')) : 'Carregando dados do tarkov.dev…'}</div>`;
    return;
  }
  // preserva foco/cursor em campos de busca
  const act = document.activeElement, id = act && act.id, pos = act && act.selectionStart;
  $('#view').innerHTML = v();
  if (id && $('#' + id) && /^(q|bq|hq|tq)$/.test(id)) { const e = $('#' + id); e.focus(); try { e.setSelectionRange(pos, pos); } catch (_) {} }
}

// ---------- eventos ----------
// EVENTOS: addEventListener registra funções que o navegador chama em resposta às ações.
// O evento toggle de details é ouvido com captura (true) porque não se propaga como um clique.
// A verificação isConnected ignora seções antigas removidas durante uma renderização.
document.addEventListener('toggle', e => {
  const details = e.target;
  if (details.isConnected && details.matches('details[data-quest-open]')) {
    const key = details.dataset.questOpen;
    if (S.questOpen[key] !== details.open) { S.questOpen[key] = details.open; save(); }
    return;
  }
  if (!details.isConnected || !details.matches('details[data-station]')) return;
  const id = details.dataset.station;
  if (S.hideoutOpen[id] === details.open) return;
  UI.hideoutOpen.set(id, details.open);
  S.hideoutOpen[id] = details.open;
  save();
}, true);
// DELEGAÇÃO DE EVENTOS: um ouvinte no document atende os botões, inclusive os criados depois por render().
// closest encontra o elemento com data-act mesmo quando o clique foi numa imagem ou texto dentro dele.
// dataset.act indica a ação; dataset.stationId e dataset.level recuperam a origem do Hideout.
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'category') { toggleCategory(t.dataset.category); }
  else if (a === 'questTrader') { S.questTrader = t.dataset.id; UI.questLevel = ''; save(); render(); }
  else if (a === 'reloadTasks') { DB.tasksState = 'idle'; loadAll(); }
  else if (a === 'moreItems') { UI.limit += 150; render(); }
  else if (a === 'collectOne') { collectOne(t.dataset.id); }
  else if (a === 'raidCollect') { raidCollectItem(t.dataset.id); }
  else if (a === 'unmarkItem') { unmarkItem(t.dataset.id); save(); render(); }
  else if (a === 'mark') {
    let source;
    if (t.dataset.stationId) {
      const station = DB.stations.find(station => station.id === t.dataset.stationId);
      const level = station?.levels.find(level => String(level.level) === t.dataset.level);
      if (!station || !level) return;
      source = hideoutSource(station, level.level);
    }
    toggleMark(t.dataset.id, +t.dataset.qty || 1, source); render();
  }
  else if (a === 'markLevel') {
    const [sid, lv] = t.dataset.key.split(':');
    const st = DB.stations.find(s => s.id === sid), l = st && st.levels.find(x => String(x.level) === lv);
    if (l) l.itemRequirements.forEach(r => addMark(r.item.id, r.count, hideoutSource(st, l.level)));
    render();
  }
  else if (a === 'clearHave') { markedRows().filter(row => row.missing === 0).forEach(row => unmarkItem(row.id)); save(); render(); }
  else if (a === 'clearAll') { if (confirm('Remover todos os itens marcados?')) { S.marked = {}; S.raidCollected = { pve: {}, regular: {} }; save(); render(); } }
});
// change trata escolhas concluídas: níveis concluídos, ordenação e filtros.
// As mudanças em S chamam save(); as opções temporárias de UI são redesenhadas sem gravação permanente.
document.addEventListener('change', e => {
  const t = e.target; const a = t.dataset && t.dataset.act;
  if (a === 'questDone') { setQuestDone(t.dataset.id, t.checked); }
  else if (a === 'raidQuest') { setRaidQuest(t.dataset.id, t.checked); }
  else if (a === 'done') { if (t.checked) S.done[t.dataset.key] = true; else delete S.done[t.dataset.key]; save(); render(); }
  else if (t.id === 'questStatus') { UI.questStatus = t.value; render(); }
  else if (t.id === 'questLevel') { UI.questLevel = t.value; render(); }
  else if (t.id === 'sort') { UI.sort = t.value; render(); }
  else if (t.id === 'onlyMarked') { UI.onlyMarked = t.checked; render(); }
  else if (t.id === 'btrader') { UI.btrader = t.value; render(); }
  else if (t.id === 'bsort') { UI.bsort = t.value; render(); }
  else if (t.id === 'bOnlyMarked') { UI.bOnlyMarked = t.checked; render(); }
});
// input acompanha a digitação dos campos de busca.
// Para as buscas, o debounce cancela a espera anterior e aguarda 200 ms sem digitação antes de filtrar, reduzindo redesenhos.
let deb;
document.addEventListener('input', e => {
  const id = e.target.id;
  if (!['q', 'bq', 'hq', 'tq'].includes(id)) return;
  clearTimeout(deb);
  deb = setTimeout(() => { UI[id] = e.target.value; UI.limit = 150; render(); }, 200);
});
// CONTROLES FIXOS: estes elementos já existem no HTML inicial, então recebem ouvintes diretamente.
// Trocar modo salva a preferência e busca dados novos; trocar aba salva a escolha e redesenha a área principal.
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.tab = b.dataset.tab; save(); render(); } });
$('#refresh').addEventListener('click', loadAll);
$('#mode').value = S.mode;
$('#mode').addEventListener('change', e => { S.mode = e.target.value; save(); loadAll(); });

// INICIALIZAÇÃO: grava o estado validado, desenha a tela inicial e começa a consulta dos dados.
// setInterval repete loadAll a cada REFRESH_MS enquanto a página permanece aberta.
save();
render();
loadAll();
setInterval(loadAll, REFRESH_MS);
</script>
</body>
</html>
